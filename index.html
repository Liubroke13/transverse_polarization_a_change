<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VVB Transverse Polarization Animations Matrix</title>
  
  <style>
    body {
      font-family: 'Times New Roman', Times, serif;
      background-color: #ffffff;
      color: #000000;
      margin: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Rotation Notice Banner for Mobile Portrait Mode */
    .rotate-notice {
      display: none;
      background-color: #fff3cd;
      color: #856404;
      border: 1px solid #ffeeba;
      padding: 10px 16px;
      border-radius: 6px;
      margin-bottom: 15px;
      text-align: center;
      font-size: 0.95rem;
      width: 100%;
      max-width: 960px;
      box-sizing: border-box;
    }

    @media screen and (max-width: 768px) and (orientation: portrait) {
      .rotate-notice {
        display: block;
      }
    }

    .slide-container {
      width: 100%;
      max-width: 960px;
    }

    .slide-title {
      font-size: 1.25rem;
      text-align: center;
      margin-bottom: 2px;
    }

    .slide-subtitle {
      font-size: 1.05rem;
      text-align: center;
      margin-top: 0;
      margin-bottom: 16px;
    }

    .math {
      font-family: 'Cambria Math', 'STIX Two Math', 'Times New Roman', serif;
      font-style: italic;
    }

    /* 主網格容器：無縫銜接 */
    .animation-grid {
      display: flex;
      flex-direction: column;
      gap: 0px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
      background-color: #ffffff;
    }

    /* 上方標頭行 */
    .header-row {
      display: grid;
      grid-template-columns: 115px repeat(4, 1fr);
      gap: 2px;
      height: 50px;
      background-color: #ffffff;
    }

    .grid-cell {
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 1.25rem;
      white-space: nowrap;
    }

    /* 左上角標頭 */
    .top-left-header {
      background-color: #a6a6a6;
      font-size: 1.05rem;
      line-height: 1.3;
      flex-direction: column;
      color: #000000;
    }

    /* 上方橘色標頭 */
    .orange-cell {
      background-color: #fca385;
      color: #000000;
      font-weight: normal;
    }

    /* 每一行獨立長方形容器 */
    .row-block {
      display: grid;
      grid-template-columns: 115px repeat(4, 1fr);
      gap: 4px;
      align-items: center;
      padding: 12px 6px;
      box-sizing: border-box;
    }

    /* 行1：白色長方形框 */
    .row-alpha-0 {
      background-color: #ffffff;
      border-top: 1px solid #d0d0d0;
      border-bottom: 1px solid #d0d0d0;
      color: #000000;
    }

    /* 行2：灰色漸層長方形框 */
    .row-alpha-half {
      background: linear-gradient(to right, #808080, #9a9a9a);
      color: #000000;
    }

    /* 行3：黑色漸層長方形框 */
    .row-alpha-pi {
      background: linear-gradient(to right, #000000, #1c1c1c);
      color: #ffffff;
    }

    /* 左側 alpha 標籤欄 */
    .alpha-label {
      font-size: 1.3rem;
      text-align: center;
      padding: 5px;
    }

    /* 影片儲存格 */
    .video-cell {
      position: relative;
      width: 100%;
      aspect-ratio: 1 / 1;
      background-color: #000000;
      border: 1px solid rgba(255, 255, 255, 0.6);
      box-sizing: border-box;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* 修正影片渲染設定：保持原清晰度不模糊 */
    video {
      width: 100%;
      height: 100%;
      display: block;
      pointer-events: none;
      /* 強化細線與高對比線條渲染 */
      image-rendering: -webkit-optimize-contrast;
      image-rendering: crisp-edges;
    }

    video::-webkit-media-controls {
      display: none !important;
    }
    video::-webkit-media-controls-start-playback-button {
      display: none !important;
      -webkit-appearance: none !important;
    }

    /* 右下角數字 overlay */
    .l-overlay {
      position: absolute;
      bottom: 4px;
      right: 10px;
      color: #ffffff;
      font-family: 'Times New Roman', Times, serif;
      font-size: 1.8rem;
      pointer-events: none;
      text-shadow: 1px 1px 3px #000000, -1px -1px 3px #000000;
      z-index: 10;
      display: flex;
      align-items: center;
    }
  </style>
</head>
<body>

<div class="rotate-notice">
    <strong>Please rotate your phone for optimal display.</strong> 
</div>

<div class="slide-container">
  <div class="slide-title">
    In the below figures : <span class="math">&beta;</span> = <span class="math">&pi;</span>/2
  </div>
  <div class="slide-subtitle">(figures are plotted <strong>without</strong> the approximation)</div>

  <div class="animation-grid">
    <!-- Header Row -->
    <div class="header-row">
      <div class="grid-cell top-left-header">
        <div><span class="math">&ell;</span> = &minus;1</div>
        <div><span class="math">&sigma;</span> = &minus;<span class="math">&sigma;'</span> = 1,</div>
      </div>
      <div class="grid-cell orange-cell"><span class="math">&ell;'</span> = &minus;1</div>
      <div class="grid-cell orange-cell"><span class="math">&ell;'</span> = 0</div>
      <div class="grid-cell orange-cell"><span class="math">&ell;'</span> = 1</div>
      <div class="grid-cell orange-cell"><span class="math">&ell;'</span> = 2</div>
    </div>

    <!-- Row 1: alpha = 0 -->
    <div class="row-block row-alpha-0">
      <div class="grid-cell alpha-label">
        <span class="math">&alpha;</span> = 0
      </div>

      <div class="video-cell">
        <video src="l_-1_lp_-1.mp4" muted loop playsinline webkit-playsinline preload="auto" disablePictureInPicture controlsList="nodownload no-fullscreen noremoteplayback"></video>
        <div class="l-overlay">&Delta;<span class="math">&ell;</span> = 0</div>
      </div>

      <div class="video-cell">
        <video src="l_-1_lp_0.mp4" muted loop playsinline webkit-playsinline preload="auto" disablePictureInPicture controlsList="nodownload no-fullscreen noremoteplayback"></video>
        <div class="l-overlay">1</div>
      </div>

      <div class="video-cell">
        <video src="l_-1_lp_1.mp4" muted loop playsinline webkit-playsinline preload="auto" disablePictureInPicture controlsList="nodownload no-fullscreen noremoteplayback"></video>
        <div class="l-overlay">2</div>
      </div>

      <div class="video-cell">
        <video src="l_-1_lp_2.mp4" muted loop playsinline webkit-playsinline preload="auto" disablePictureInPicture controlsList="nodownload no-fullscreen noremoteplayback"></video>
        <div class="l-overlay">3</div>
      </div>
    </div>

    <!-- Row 2: alpha = pi/2 -->
    <div class="row-block row-alpha-half">
      <div class="grid-cell alpha-label">
        <span class="math">&alpha;</span> = <span class="math">&pi;</span>/2
      </div>

      <div class="video-cell">
        <video src="l_-1_lp_-1_alpha_0.50pi.mp4" muted loop playsinline webkit-playsinline preload="auto" disablePictureInPicture controlsList="nodownload no-fullscreen noremoteplayback"></video>
      </div>

      <div class="video-cell">
        <video src="l_-1_lp_0_alpha_0.50pi.mp4" muted loop playsinline webkit-playsinline preload="auto" disablePictureInPicture controlsList="nodownload no-fullscreen noremoteplayback"></video>
      </div>

      <div class="video-cell">
        <video src="l_-1_lp_1_alpha_0.50pi.mp4" muted loop playsinline webkit-playsinline preload="auto" disablePictureInPicture controlsList="nodownload no-fullscreen noremoteplayback"></video>
      </div>

      <div class="video-cell">
        <video src="l_-1_lp_2_alpha_0.50pi.mp4" muted loop playsinline webkit-playsinline preload="auto" disablePictureInPicture controlsList="nodownload no-fullscreen noremoteplayback"></video>
      </div>
    </div>

    <!-- Row 3: alpha = pi -->
    <div class="row-block row-alpha-pi">
      <div class="grid-cell alpha-label">
        <span class="math">&alpha;</span> = <span class="math">&pi;</span>
      </div>

      <div class="video-cell">
        <video src="l_-1_lp_-1_alpha_1.00pi.mp4" muted loop playsinline webkit-playsinline preload="auto" disablePictureInPicture controlsList="nodownload no-fullscreen noremoteplayback"></video>
      </div>

      <div class="video-cell">
        <video src="l_-1_lp_0_alpha_1.00pi.mp4" muted loop playsinline webkit-playsinline preload="auto" disablePictureInPicture controlsList="nodownload no-fullscreen noremoteplayback"></video>
      </div>

      <div class="video-cell">
        <video src="l_-1_lp_1_alpha_1.00pi.mp4" muted loop playsinline webkit-playsinline preload="auto" disablePictureInPicture controlsList="nodownload no-fullscreen noremoteplayback"></video>
      </div>

      <div class="video-cell">
        <video src="l_-1_lp_2_alpha_1.00pi.mp4" muted loop playsinline webkit-playsinline preload="auto" disablePictureInPicture controlsList="nodownload no-fullscreen noremoteplayback"></video>
      </div>
    </div>

  </div>
</div>

<script>
  async function syncAndPlayAllVideos() {
    const videos = Array.from(document.querySelectorAll('video'));

    videos.forEach(v => {
      v.muted = true;
      v.defaultMuted = true;
      v.pause();
    });

    const loadPromises = videos.map(v => {
      return new Promise((resolve) => {
        if (v.readyState >= 2) {
          resolve();
        } else {
          v.addEventListener('canplay', () => resolve(), { once: true });
          v.load();
        }
      });
    });

    await Promise.all(loadPromises);

    videos.forEach(v => {
      v.currentTime = 0;
    });

    const playPromises = videos.map(v => v.play());
    
    Promise.all(playPromises).catch(() => {
      const forcePlayOnInteraction = () => {
        videos.forEach(v => {
          v.currentTime = 0;
          v.play();
        });
      };
      document.addEventListener('touchstart', forcePlayOnInteraction, { once: true });
      document.addEventListener('click', forcePlayOnInteraction, { once: true });
    });
  }

  if (document.readyState === 'complete') {
    syncAndPlayAllVideos();
  } else {
    window.addEventListener('load', syncAndPlayAllVideos);
  }
</script>

</body>
</html>
